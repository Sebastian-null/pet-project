<tr id="variant-{{ variant.id }}"><td>{{ variant.sku }}</td><td>{{ variant.color }} / {{ variant.size }}</td><td colspan="2"><form hx-patch="/admin/variants/{{ variant.id }}" hx-target="#variant-{{ variant.id }}" hx-swap="outerHTML" class="inline"><input name="price" type="number" step="0.01" min="0.01" value="{{ '%.2f'|format(variant.price) }}" aria-label="Price"> ₴<input name="stock" type="number" min="0" value="{{ variant.stock }}" aria-label="Stock"> шт<button>Save</button>{% if saved %}<span class="muted">saved</span>{% endif %}</form></td></tr>
