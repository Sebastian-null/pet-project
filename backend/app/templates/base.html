<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://unpkg.com/htmx.org@2.0.4"></script><title>Briefs CRM</title><style>body{margin:0;background:#f6f4f1;color:#20201f;font:15px system-ui,sans-serif}nav{background:#20201f;color:#fff;padding:18px 7%;display:flex;gap:24px;align-items:center}nav a{color:#fff;text-decoration:none}main{max-width:1100px;margin:42px auto;padding:0 22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,table{background:#fff;border-radius:12px;padding:20px;box-sizing:border-box}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid #eee}.metric{font-size:30px;font-weight:700}select,button,input{padding:9px;border-radius:7px;border:1px solid #ddd}button{background:#20201f;color:white;cursor:pointer}.status{font-weight:600;text-transform:capitalize}.muted{color:#777}@media(max-width:650px){.grid{grid-template-columns:1fr}table{font-size:12px}}</style></head><body>{% if user %}<nav><strong>BRIEFS / CRM</strong><a href="/admin">Overview</a><a href="/admin/orders">Orders</a><a href="/admin/products">Products</a><form action="/admin/logout" method="post" style="margin-left:auto"><button>Sign out</button></form></nav>{% endif %}<main>{% block content %}{% endblock %}</main></body></html>
