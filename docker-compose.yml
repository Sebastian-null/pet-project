services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-briefs}
      POSTGRES_USER: ${POSTGRES_USER:-briefs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-briefs_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://briefs:briefs_dev_password@postgres:5432/briefs}
      JWT_SECRET: ${JWT_SECRET:-replace-this-before-production}
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  storefront:
    build:
      context: ./storefront
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      API_INTERNAL_URL: http://backend:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  postgres_data:
