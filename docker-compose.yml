services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-briefs}
      POSTGRES_USER: ${POSTGRES_USER:-briefs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-briefs_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://briefs:briefs_dev_password@postgres:5432/briefs}
      JWT_SECRET: ${JWT_SECRET:-replace-this-before-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      STOREFRONT_URL: ${STOREFRONT_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-BRIEFS <no-reply@briefs.store>}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-uah}
    ports: ["8000:8000"]
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  storefront:
    build:
      context: ./storefront
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        API_INTERNAL_URL: http://backend:8000/api/v1
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      API_INTERNAL_URL: http://backend:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  postgres_data:
  media_data:
